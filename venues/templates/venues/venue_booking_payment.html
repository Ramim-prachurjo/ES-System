{% extends "base.html" %}
{% block title %}Venue Booking Payment{% endblock %}

{% block content %}
<style>
  .payment-wrap {
    max-width: 620px;
    margin: 0 auto;
  }
  .payment-wrap h2 {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: #d9a8a8;
    margin-bottom: 8px;
  }
  .payment-wrap p {
    color: #a89a9a;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .payment-table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    font-size: 14px;
  }
  .payment-table th {
    text-align: left;
    padding: 12px 16px;
    background: rgba(255,255,255,0.05);
    color: #a89a9a;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    width: 40%;
  }
  .payment-table td {
    padding: 12px 16px;
    color: #e0cccc;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .payment-code {
    font-size: 1.4em;
    font-weight: bold;
    color: #7ec8e3;
    letter-spacing: 3px;
    font-family: 'Cinzel', serif;
  }
  .amount-highlight {
    color: #ff9999;
    font-weight: bold;
    font-size: 1.1em;
  }

  .info-box {
    padding: 16px 20px;
    border-radius: 10px;
    margin: 16px 0;
    font-size: 13px;
    line-height: 1.7;
  }
  .info-box.blue {
    background: rgba(100, 180, 220, 0.1);
    border: 1px solid rgba(100, 180, 220, 0.25);
    color: #a8d8ea;
  }
  .info-box.yellow {
    background: rgba(255, 200, 80, 0.1);
    border: 1px solid rgba(255, 200, 80, 0.25);
    color: #ffd580;
  }
  .info-box ol {
    margin: 8px 0 0 0;
    padding-left: 20px;
  }
  .info-box strong { color: #fff; }

  .btn-back {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 24px;
    border-radius: 8px;
    background: linear-gradient(135deg, #c46060, #a04040);
    color: #fff;
    font-family: 'Raleway', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s;
  }
  .btn-back:hover { background: linear-gradient(135deg, #d47070, #b05050); }
</style>
