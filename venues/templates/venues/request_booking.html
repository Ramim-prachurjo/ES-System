{% extends "base.html" %}
{% block title %}Request Booking{% endblock %}

{% block content %}
<style>
  .booking-wrap {
    max-width: 520px;
    margin: 0 auto;
  }

  .booking-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 28px 32px;
  }

  h2 {
    color: #d9a8a8;
    margin-bottom: 12px;
  }

  .venue-info {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 20px;
  }

  form p {
    margin-bottom: 14px;
  }

  input, select, textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3);
    color: #eee;
  }

  button {
    margin-top: 10px;
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    background: rgba(180,80,80,0.7);
    color: white;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.85;
  }

  .btn-back {
    display: inline-block;
    margin-top: 12px;
    font-size: 13px;
    color: #aaa;
    text-decoration: none;
  }
</style>

<div class="booking-wrap">
  <div class="booking-card">

    <h2>📅 Request Booking</h2>

    <div class="venue-info">
      {{ venue.name }} <br>
      📍 {{ venue.city }} | 👥 Capacity: {{ venue.capacity }}
    </div>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Submit Request</button>
    </form>

  </div>

  <a href="{% url 'venue_list' %}" class="btn-back">← Back to Venues</a>
</div>

{% endblock %}
