{% extends "base.html" %}
{% block title %}My History{% endblock %}

{% block content %}
<style>
  .page-header { margin-bottom: 32px; }
  .page-header h1 {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    color: #d9a8a8;
    letter-spacing: 0.06em;
  }
  .page-header p { color: #a89a9a; font-size: 14px; margin-top: 6px; }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 17px;
    color: #d9a8a8;
    margin: 36px 0 16px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    letter-spacing: 0.05em;
  }

  .history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .history-table th {
    text-align: left;
    padding: 10px 14px;
    color: #7a6a6a;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.02);
  }
  .history-table td {
    padding: 12px 14px;
    color: #e0cccc;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    vertical-align: middle;
  }
  .history-table tr:last-child td { border-bottom: none; }
  .history-table tr:hover td {
    background: rgba(255,255,255,0.02);
  }

  /* Status badges */
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: capitalize;
  }
  .badge.pending   { background: rgba(255,200,80,0.15);  color: #ffd580; border: 1px solid rgba(255,200,80,0.3); }
  .badge.confirmed { background: rgba(60,180,100,0.15);  color: #7ee8a2; border: 1px solid rgba(60,180,100,0.3); }
  .badge.cancelled { background: rgba(150,150,150,0.12); color: #aaa;    border: 1px solid rgba(150,150,150,0.25); }
  .badge.active    { background: rgba(100,180,255,0.15); color: #90caff; border: 1px solid rgba(100,180,255,0.3); }
  .badge.ongoing   { background: rgba(180,100,255,0.15); color: #d4a0ff; border: 1px solid rgba(180,100,255,0.3); }
  .badge.completed { background: rgba(60,180,100,0.15);  color: #7ee8a2; border: 1px solid rgba(60,180,100,0.3); }

  /* Payment badge */
  .pay-badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .pay-badge.required   { background: rgba(255,100,100,0.15); color: #ff9999; border: 1px solid rgba(255,100,100,0.3); }
  .pay-badge.confirmed  { background: rgba(60,180,100,0.15);  color: #7ee8a2; border: 1px solid rgba(60,180,100,0.3); }
  .pay-badge.none       { background: rgba(255,255,255,0.05); color: #666;    border: 1px solid rgba(255,255,255,0.08); }

  .empty-row td {
    text-align: center;
    color: #5a4a4a;
    padding: 32px;
    font-size: 14px;
  }

  .view-link {
    color: #d9a8a8;
    text-decoration: none;
    font-size: 12px;
    padding: 4px 12px;
    border: 1px solid rgba(217,168,168,0.25);
    border-radius: 6px;
    transition: background 0.2s;
  }
  .view-link:hover {
    background: rgba(217,168,168,0.1);
  }

  .pay-link {
    color: #7ec8e3;
    text-decoration: none;
    font-size: 12px;
    padding: 4px 12px;
    border: 1px solid rgba(100,180,220,0.25);
    border-radius: 6px;
    margin-left: 6px;
    transition: background 0.2s;
  }
  .pay-link:hover { background: rgba(100,180,220,0.1); }
</style>
