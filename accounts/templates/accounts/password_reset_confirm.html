<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a New Password | MARKSMEN_es</title><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;background:#0b0b19;color:#eeeaff;font-family:Rajdhani,sans-serif}.card{width:min(100%,490px);padding:34px;border:1px solid #7653ad;border-radius:18px;background:#14132be6}.brand,h1{font-family:Syncopate,sans-serif}.brand{color:#c6a2ff;font-size:15px}h1{font-size:22px;color:#fff}p{color:#c1b8d0;line-height:1.5}label{display:block;margin:16px 0 6px;color:#d2b7ff;font-size:12px;font-weight:700}input{width:100%;padding:12px;border:1px solid #70549e;border-radius:8px;background:#111024;color:#fff}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#8150e6;color:#fff;font:700 12px Syncopate,sans-serif}.link{color:#d6bdff;text-decoration:none}</style></head><body><main class="card"><div class="brand">MARKSMEN_es</div>{% if validlink %}<h1>Choose a new password</h1><p>Use a strong password you do not use elsewhere.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Update password</button></form>{% else %}<h1>Link unavailable</h1><p>This reset link has expired or was already used. Request a new password reset.</p><a class="link" href="{% url 'password_reset' %}">Request another link</a>{% endif %}</main></body></html>
