<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | MARKSMEN_es</title><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 85% 8%,#38206f 0,transparent 38%),#0b0b19;color:#eeeaff;font-family:Rajdhani,sans-serif}.card{width:min(100%,490px);padding:34px;border:1px solid rgba(195,157,255,.27);border-radius:18px;background:rgba(20,19,43,.9);box-shadow:0 25px 60px #0007}.eyebrow{color:#caa8ff;font:700 10px Syncopate,sans-serif;letter-spacing:.13em}.brand{margin-bottom:21px;color:#f4f0ff;font:700 16px Syncopate,sans-serif}.brand span{color:#b584ff}h1{margin:8px 0;color:#fff;font:700 25px Syncopate,sans-serif;letter-spacing:-.05em}p{color:#b9b0c9;font-size:15px;line-height:1.5}label{display:block;margin:21px 0 7px;color:#d2b7ff;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}input{width:100%;padding:12px;border:1px solid rgba(195,157,255,.3);border-radius:8px;background:#111024;color:#fff;font:600 15px Rajdhani,sans-serif}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:linear-gradient(135deg,#9156ff,#6333c7);color:#fff;font:700 12px Syncopate,sans-serif;cursor:pointer}.back{display:block;margin-top:20px;color:#d5beff;text-align:center;text-decoration:none;font-size:13px}</style></head><body><main class="card"><div class="brand">MARKSMEN<span>_es</span></div><div class="eyebrow">Account recovery</div><h1>Reset your password</h1><p>Enter the email address linked to your account. We will send a secure reset link if an account exists.</p><form method="post">{% csrf_token %}<label for="id_email">Email address</label>{{ form.email }}{% if form.email.errors %}<p>{{ form.email.errors }}</p>{% endif %}<button type="submit">Send reset link</button></form><a class="back" href="{% url 'login' %}">← Back to login</a></main></body></html>
